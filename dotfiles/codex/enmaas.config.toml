model = "gpt-6-luna"
model_provider = "enmaas"
model_reasoning_effort = "xhigh"
plan_mode_reasoning_effort = "xhigh"
service_tier = "default"

[model_providers.enmaas]
name = "EnMaaS"
base_url = "https://api.enmaas.devshift.net/v1"
wire_api = "responses"

[model_providers.enmaas.auth]
command = "python3"
args = [
  "-c",
  """
import netrc
import sys

auth = netrc.netrc().authenticators("api.enmaas.devshift.net")
if not auth or not auth[2]:
    sys.exit("No EnMaaS key found in ~/.netrc")
print(auth[2])
"""
]
timeout_ms = 5000
refresh_interval_ms = 0
